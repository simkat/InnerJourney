name: Keep config connected

on:
  push:
    branches: [main]
    paths:
      - index.html

permissions:
  contents: write

jobs:
  ensure-config-loader:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Restore config loader when needed
        shell: bash
        run: |
          set -euo pipefail

          if grep -q 'config\.js' index.html; then
            echo "config.js loader already present"
            exit 0
          fi

          awk '
            !inserted && /<script>/ {
              print "<script src=\"./config.js\"></script>"
              inserted = 1
            }
            { print }
          ' index.html > index.html.tmp
          mv index.html.tmp index.html

          if ! grep -q 'config\.js' index.html; then
            echo "Could not restore the config.js loader" >&2
            exit 1
          fi

      - name: Push loader repair
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- index.html; then
            echo "No repair needed"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "chore: reconnect external config"
          git push origin HEAD:main
